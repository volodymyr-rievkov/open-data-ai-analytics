apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: open-data-ai
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/volodymyr-rievkov/open-data-ai-analytics/web:latest
          ports:
            - containerPort: 8501
          env:
            - name: DATA_PATH
              value: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
