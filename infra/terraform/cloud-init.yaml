#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git

runcmd:
  # ── Встановлення Docker ──────────────────────────────────────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo \
      "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
      https://download.docker.com/linux/ubuntu \
      $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
      tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # ── Запуск Docker ────────────────────────────────────────────────────────
  - systemctl enable docker
  - systemctl start docker

  # ── Додаємо azureuser до групи docker ────────────────────────────────────
  - usermod -aG docker azureuser

  # ── Клонування репозиторію (гілка передається з Terraform) ───────────────
  - git clone -b ${repo_branch} https://github.com/volodymyr-rievkov/open-data-ai-analytics /opt/app
  - chown -R azureuser:azureuser /opt/app
  - echo "[cloud-init] Репозиторій склоновано з гілки ${repo_branch}"

  # ── Запуск застосунку ─────────────────────────────────────────────────────
  - cd /opt/app && docker compose up -d
  - echo "[cloud-init] Застосунок запущено"

  # ── Запуск моніторингу ────────────────────────────────────────────────────
  - cd /opt/app && docker compose -f docker-compose.monitoring.yaml up -d
  - echo "[cloud-init] Моніторинг запущено"

final_message: |
  ✅ cloud-init завершено успішно після $UPTIME секунд.
  Гілка      : ${repo_branch}
  Застосунок : http://PUBLIC_IP:8501
  Grafana     : http://PUBLIC_IP:3000  (admin / admin123)
  Prometheus  : http://PUBLIC_IP:9090
