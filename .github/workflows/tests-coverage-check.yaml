name: Coverage
on:
  workflow_call:

jobs:
  tests-coverage:
    runs-on: self-hosted
    env:
      COVERAGE_THRESHOLD: 85
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install

      - name: Install coverage
        run: uv tool install coverage[toml]

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-report-* 
          merge-multiple: true       
          path: .

      - name: Report & Check Threshold
        run: |
          coverage combine
          coverage report -m --fail-under=${{ env.COVERAGE_THRESHOLD }}
          echo "Target Threshold: ${{ env.COVERAGE_THRESHOLD }}%"